<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e4e7f1;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
    }

    .header .blue { color: #74b9ff; }
    .header .purple { color: #6c5ce7; }

    /* Focus toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1d27;
      border: 1px solid #2e3346;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .toggle-label { font-size: 13px; font-weight: 600; }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #2e3346;
      border-radius: 12px;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: #00b894;
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(20px);
    }

    /* Status */
    .status {
      text-align: center;
      font-size: 11px;
      padding: 6px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .status-on { background: rgba(0, 184, 148, 0.15); color: #00b894; }
    .status-off { background: rgba(139, 144, 165, 0.15); color: #8b90a5; }

    /* Add site */
    .add-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .add-row input {
      flex: 1;
      padding: 7px 10px;
      background: #232733;
      border: 1px solid #2e3346;
      border-radius: 6px;
      color: #e4e7f1;
      font-size: 12px;
      outline: none;
    }

    .add-row input:focus { border-color: #6c5ce7; }

    .add-row button {
      padding: 7px 12px;
      background: #6c5ce7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-row button:hover { opacity: 0.9; }

    /* Site list */
    .site-list { list-style: none; }

    .site-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #1a1d27;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .site-item .remove-btn {
      background: none;
      border: none;
      color: #e17055;
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
    }

    .site-item .remove-btn:hover { color: #ff6b6b; }

    .empty-msg {
      text-align: center;
      font-size: 11px;
      color: #8b90a5;
      padding: 12px 0;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      color: #8b90a5;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #2e3346;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌊 <span class="blue">Calm</span><span class="purple">Flow</span> Blocker</h1>
  </div>

  <!-- Focus Mode Toggle -->
  <div class="toggle-row">
    <span class="toggle-label">🎯 Focus Mode</span>
    <label class="toggle-switch">
      <input type="checkbox" id="focus-toggle">
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div id="status-bar" class="status status-off">Focus Mode OFF</div>

  <!-- Add Site -->
  <div class="add-row">
    <input type="text" id="site-input" placeholder="e.g. twitter.com">
    <button id="add-btn">Add</button>
  </div>

  <!-- Blocked Sites List -->
  <ul class="site-list" id="site-list"></ul>

  <div class="footer">Sites are blocked when Focus Mode is ON</div>

  <script src="popup.js"></script>
</body>
</html>
