<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked - CalmFlow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      color: #e4e7f1;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .container {
      text-align: center;
      max-width: 500px;
      padding: 40px;
    }

    .wave {
      font-size: 80px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    h1 .blue { color: #74b9ff; }
    h1 .purple { color: #6c5ce7; }

    .message {
      font-size: 18px;
      color: #8b90a5;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .blocked-site {
      display: inline-block;
      padding: 8px 20px;
      background: rgba(225, 112, 85, 0.15);
      color: #e17055;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .quote {
      font-style: italic;
      color: #6c5ce7;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .go-back {
      padding: 12px 30px;
      background: #6c5ce7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .go-back:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <div class="wave">🌊</div>
    <h1><span class="blue">Calm</span><span class="purple">Flow</span></h1>
    <p class="message">This site is blocked during Focus Mode.</p>
    <div class="blocked-site" id="site-name"></div>
    <p class="quote" id="quote"></p>
    <button class="go-back" onclick="history.back()">← Go Back</button>
  </div>

  <script>
    // Show which site was blocked
    const params = new URLSearchParams(window.location.search);
    const site = params.get('site') || 'this site';
    document.getElementById('site-name').textContent = '🚫 ' + site;

    // Random motivational quote
    const quotes = [
      "Stay focused. You're doing great.",
      "Your future self will thank you.",
      "One more hour of studying > one more hour of scrolling.",
      "Discipline is choosing between what you want now and what you want most.",
      "You didn't come this far to only come this far.",
      "Focus on progress, not perfection.",
      "Small steps every day lead to big results."
    ];
    document.getElementById('quote').textContent = '"' + quotes[Math.floor(Math.random() * quotes.length)] + '"';
  </script>
</body>
</html>
