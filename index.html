<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalmFlow - Study Dashboard</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1 class="logo">🌊 <span class="logo-calm">Calm</span><span class="logo-flow">Flow</span></h1>
    <span class="clock" id="clock"></span>
  </header>

  <!-- Navigation -->
  <nav class="nav">
    <button class="nav-btn active" data-panel="calendar">📅 Calendar</button>
    <button class="nav-btn" data-panel="todo">✅ Todo</button>
    <button class="nav-btn" data-panel="timer">⏱ Timer</button>
    <button class="nav-btn" data-panel="blocker">🚫 Blocker</button>
  </nav>

  <!-- Main Content -->
  <main class="container">
    <!-- Calendar Page -->
    <section class="page active" id="page-calendar">
      <div id="calendar-month"></div>
      <div id="calendar-day" style="display:none"></div>
    </section>

    <!-- Todo Page -->
    <section class="page" id="page-todo">
      <div id="todo-container"></div>
    </section>

    <!-- Timer Page -->
    <section class="page" id="page-timer">
      <div id="timer-container"></div>
    </section>

    <!-- Blocker Page -->
    <section class="page" id="page-blocker">
      <div id="blocker-container"></div>
    </section>
  </main>

  <!-- Modal: Edit Event -->
  <div class="modal-backdrop" id="edit-event-modal">
    <div class="modal-box" id="edit-event-body"></div>
  </div>

  <!-- Modal: Add Subject -->
  <div class="modal-backdrop" id="add-subject-modal">
    <div class="modal-box" id="add-subject-body"></div>
  </div>

  <!-- App Logic -->
  <script src="script.js"></script>
</body>
</html>
